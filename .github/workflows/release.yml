name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x .github/generate_changelog.sh
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git tag --sort=-creatordate | awk -v cur="$current_tag" 'found { print; exit } $0 == cur { found=1 }')

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="$current_tag"
          fi

          version="${current_tag#v}"
          image="${REGISTRY}/${IMAGE_NAME}:${version}"
          package_url="https://github.com/${IMAGE_NAME}/pkgs/container/readone?tag=${version}"

          {
            echo "changelog<<EOF"
            .github/generate_changelog.sh "$range" "$image" "$package_url"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          body: ${{ steps.changelog.outputs.changelog }}
